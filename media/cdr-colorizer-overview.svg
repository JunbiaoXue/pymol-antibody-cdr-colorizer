<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">PyMOL Antibody CDR Colorizer 示意图</title>
  <desc id="desc">展示抗体可变区中 CDR1、CDR2、CDR3 的默认着色和插件识别流程。</desc>
  <rect width="1200" height="440" rx="28" fill="#f7f8fa"/>

  <text x="600" y="48" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif"
        font-size="28" font-weight="700" fill="#1f2328">PyMOL Antibody CDR Colorizer</text>
  <text x="600" y="78" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif"
        font-size="16" fill="#57606a">自动识别 VH / VL / VHH，并按 IMGT 定义定位 CDR</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
    <!-- Stylized variable domains -->
    <g transform="translate(70 115)">
      <rect x="0" y="0" width="420" height="205" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
      <text x="210" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">CDR 着色效果示意</text>

      <path d="M105 155 C120 95, 155 70, 195 72 C235 74, 270 100, 286 155"
            fill="none" stroke="#8c959f" stroke-width="18" stroke-linecap="round"/>
      <path d="M135 108 C146 91, 158 82, 171 79"
            fill="none" stroke="#f1c40f" stroke-width="18" stroke-linecap="round"/>
      <path d="M190 74 C204 73, 218 75, 231 80"
            fill="none" stroke="#d336b3" stroke-width="18" stroke-linecap="round"/>
      <path d="M248 92 C263 105, 275 125, 283 149"
            fill="none" stroke="#19b5c5" stroke-width="18" stroke-linecap="round"/>

      <text x="40" y="188" font-size="15" fill="#57606a">Framework</text>
      <line x1="108" y1="184" x2="125" y2="155" stroke="#8c959f" stroke-width="2"/>

      <circle cx="320" cy="82" r="8" fill="#f1c40f"/>
      <text x="338" y="88" font-size="16" fill="#1f2328">CDR1 · yellow</text>
      <circle cx="320" cy="120" r="8" fill="#d336b3"/>
      <text x="338" y="126" font-size="16" fill="#1f2328">CDR2 · magenta</text>
      <circle cx="320" cy="158" r="8" fill="#19b5c5"/>
      <text x="338" y="164" font-size="16" fill="#1f2328">CDR3 · cyan</text>
    </g>

    <!-- Backend -->
    <g transform="translate(535 115)">
      <rect x="0" y="0" width="595" height="205" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
      <text x="297" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">识别流程</text>

      <g transform="translate(28 70)">
        <rect width="118" height="56" rx="14" fill="#eef4ff" stroke="#54aeff"/>
        <text x="59" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#0969da">PDB / mmCIF</text>
        <text x="59" y="43" text-anchor="middle" font-size="12" fill="#57606a">提取序列</text>
      </g>
      <path d="M153 98 H182" stroke="#8c959f" stroke-width="3"/>
      <path d="M174 90 L184 98 L174 106" fill="none" stroke="#8c959f" stroke-width="3"/>

      <g transform="translate(190 56)">
        <rect width="145" height="84" rx="14" fill="#f6f8fa" stroke="#8c959f"/>
        <text x="72" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">编号后端</text>
        <text x="72" y="47" text-anchor="middle" font-size="13" fill="#1f2328">ANARCI</text>
        <text x="72" y="65" text-anchor="middle" font-size="13" fill="#57606a">ANARCII / heuristic</text>
      </g>
      <path d="M342 98 H371" stroke="#8c959f" stroke-width="3"/>
      <path d="M363 90 L373 98 L363 106" fill="none" stroke="#8c959f" stroke-width="3"/>

      <g transform="translate(380 70)">
        <rect width="92" height="56" rx="14" fill="#f0fff4" stroke="#2da44e"/>
        <text x="46" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#1a7f37">IMGT</text>
        <text x="46" y="43" text-anchor="middle" font-size="12" fill="#57606a">CDR ranges</text>
      </g>
      <path d="M479 98 H508" stroke="#8c959f" stroke-width="3"/>
      <path d="M500 90 L510 98 L500 106" fill="none" stroke="#8c959f" stroke-width="3"/>

      <g transform="translate(516 70)">
        <rect width="54" height="56" rx="14" fill="#fff8c5" stroke="#bf8700"/>
        <text x="27" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#9a6700">Color</text>
        <text x="27" y="42" text-anchor="middle" font-size="12" fill="#57606a">+ sticks</text>
      </g>

      <text x="297" y="174" text-anchor="middle" font-size="14" fill="#57606a">
        单链 VHH 仅生成 H_CDR1 / H_CDR2 / H_CDR3；VH+VL 生成 H/L 共 6 个 selection
      </text>
    </g>

    <rect x="125" y="353" width="950" height="48" rx="24" fill="#ffffff" stroke="#d8dee4"/>
    <text x="600" y="383" text-anchor="middle" font-size="16" fill="#57606a">
      正式 IMGT 编号建议使用 ANARCI / ANARCII；内置 heuristic 用于无依赖情况下的近似识别
    </text>
  </g>
</svg>